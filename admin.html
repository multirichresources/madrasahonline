<!doctype html>
<html lang="ms" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Admin Madrasah">
<link rel="manifest" href="./manifest-admin.webmanifest">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; -webkit-tap-highlight-color: transparent; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Admin Madrasah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one phone-width column, mihrab-arch hero + 8-point star pattern, big touch targets, bottom nav for pelajar, separate admin panel */
:root {
  --bg: #ffffff;
  --surface: #f7f9f8;
  --surface2: #ebf3f1;
  --line: #dbe6e3;
  --ink: #102221;
  --muted: #4b5f5c;
  --green: #0d4b44;
  --green-ink: #ffffff;
  --green-soft: #e1efec;
  --gold: #a07d42;
  --gold-soft: #f7efe0;
  --plate: transparent;
  --player: #0d3b38;
  --player-ink: #f4f8f5;
  --warn: #8a5300;
  --warn-soft: #fcefd8;
  --danger: #ad2a20;
  --danger-soft: #fbe6e3;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-display: "Amiri", Georgia, "Times New Roman", serif;
  --f-ar: "Amiri", "Scheherazade New", "Traditional Arabic", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1615; --surface: #102120; --surface2: #172c2a; --line: #24403c;
    --ink: #eaf3f1; --muted: #a5b9b5; --green: #5cc4b0; --green-ink: #04120f;
    --green-soft: #12302b; --gold: #d6b27a; --gold-soft: #2d2617; --plate: #f7f4ec;
    --player: #061b1a; --player-ink: #eef6f4;
    --warn: #e9b05a; --warn-soft: #36290f; --danger: #f08b80; --danger-soft: #3b1d1a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1615; --surface: #102120; --surface2: #172c2a; --line: #24403c;
  --ink: #eaf3f1; --muted: #a5b9b5; --green: #5cc4b0; --green-ink: #04120f;
  --green-soft: #12302b; --gold: #d6b27a; --gold-soft: #2d2617; --plate: #f7f4ec;
  --player: #061b1a; --player-ink: #eef6f4;
  --warn: #e9b05a; --warn-soft: #36290f; --danger: #f08b80; --danger-soft: #3b1d1a;
  color-scheme: dark;
}
html { font-size: 112.5%; }
html.big { font-size: 131%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 1rem; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
* { box-sizing: border-box; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.25; }
h1 { font-family: var(--f-display); font-weight: 700; letter-spacing: .005em; }

.pat { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .32; pointer-events: none; }
.pat g { stroke: var(--gold); }
.hero { position: relative; overflow: hidden; background: var(--green-soft); border: 1px solid var(--line);
  border-radius: 50% 50% 22px 22px / 110px 110px 22px 22px; padding: 2.6rem 1.2rem 1.3rem;
  display: flex; flex-direction: column; align-items: center; gap: .35rem; text-align: center; }
.hero > :not(.pat) { position: relative; }
.bism { font-family: var(--f-ar); font-size: 1.55rem; color: var(--green); direction: rtl; line-height: 1.6; }
.hero h1 { font-size: 1.7rem; }
.orn { display: flex; align-items: center; gap: .6rem; color: var(--gold); width: 100%; }
.orn::before, .orn::after { content: ""; flex: 1; height: 1px; background: var(--gold); opacity: .55; }
.orn svg { width: 1rem; height: 1rem; flex: none; }
.toolbar { display: flex; justify-content: flex-end; align-items: center; gap: .5rem; }
.toolbar .logo-sm { margin-right: auto; }
.plate { background: var(--plate); border-radius: 22px; padding: .6rem; display: flex; justify-content: center; }
.logo { display: block; max-width: 100%; height: auto; }
.logo-lg { width: 15rem; }
.logo-sm { display: block; height: 3rem; width: auto; background: var(--plate); border-radius: 10px; padding: 2px 4px; }
.adminnote { display: flex; gap: .6rem; align-items: flex-start; background: var(--gold-soft); color: var(--ink); border-radius: 14px; padding: .8rem .9rem; font-size: .85rem; }
.adminnote svg { width: 1.2rem; height: 1.2rem; flex: none; color: var(--gold); margin-top: .1rem; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.shell { max-width: 460px; margin: 0 auto; padding-block: 12px 140px; display: flex; flex-direction: column; gap: 1.1rem; }
.shell.admin { padding-bottom: 48px; }

.demobar { max-width: 460px; margin: 0 auto; padding-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap; }
.demobar small { color: var(--muted); font-size: .75rem; letter-spacing: .04em; text-transform: uppercase; font-weight: 700; }
.seg { display: inline-flex; background: var(--surface2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; padding: .4rem .9rem; border-radius: 9px; font-weight: 700; font-size: .85rem; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--bg); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

.btn { display: flex; align-items: center; justify-content: center; gap: .55rem; min-height: 3.25rem; padding: 0 1.2rem; border-radius: 14px; border: 0; font-weight: 700; font-size: 1rem; cursor: pointer; width: 100%; text-align: center; }
.btn svg { width: 1.35rem; height: 1.35rem; flex: none; }
.btn-primary { background: var(--green); color: var(--green-ink); }
.btn-ghost { background: var(--surface2); color: var(--ink); }
.btn-line { background: transparent; color: var(--green); border: 2px solid var(--green); }
.btn-row { display: flex; gap: .6rem; }
.btn-row .btn { flex: 1; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 1.1rem; display: flex; flex-direction: column; gap: .75rem; min-width: 0; }
.eyebrow { font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.pill { display: inline-flex; align-items: center; padding: .15rem .65rem; border-radius: 99px; font-size: .8rem; font-weight: 700; white-space: nowrap; }
.pill.ok { background: var(--green-soft); color: var(--green); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--danger-soft); color: var(--danger); }

.top { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
.top h1 { font-size: 1.45rem; }
.iconbtn { display: inline-flex; align-items: center; justify-content: center; min-width: 3rem; height: 3rem; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; color: var(--ink); gap: .3rem; padding: 0 .7rem; }
.iconbtn svg { width: 1.4rem; height: 1.4rem; }

.status { border-radius: 18px; padding: 1.1rem; display: flex; flex-direction: column; gap: .6rem; }
.status.ok { background: var(--green-soft); }
.status.bad { background: var(--danger-soft); }
.status .big { font-size: 1.2rem; font-weight: 700; }

.zoom-date { display: flex; gap: .9rem; align-items: center; }
.datebox { flex: none; width: 4rem; text-align: center; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); padding: .35rem 0; }
.datebox b { display: block; font-size: 1.5rem; line-height: 1.1; }
.datebox span { font-size: .75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

.vlist { display: flex; flex-direction: column; gap: .7rem; }
.vitem { display: flex; gap: .85rem; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: .7rem; cursor: pointer; text-align: left; width: 100%; }
.thumb { flex: none; width: 4.6rem; height: 5.2rem; border-radius: 50% 50% 10px 10px / 32% 32% 10px 10px; background: var(--player); color: var(--player-ink); display: flex; align-items: center; justify-content: center; font-family: var(--f-ar); font-size: 1.05rem; line-height: 1.3; text-align: center; padding: 1rem .3rem .3rem; direction: rtl; box-shadow: inset 0 0 0 2px var(--gold); }
.vinfo { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: .2rem; }
.vinfo b { font-size: 1rem; line-height: 1.3; }
.bar { height: 6px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); border-radius: 99px; }

.chips { display: flex; gap: .5rem; overflow-x: auto; padding-bottom: 2px; }
.chip { flex: none; border: 2px solid var(--line); background: var(--bg); border-radius: 99px; padding: .45rem 1rem; font-weight: 700; cursor: pointer; color: var(--ink); }
.chip.on { background: var(--green); border-color: var(--green); color: var(--green-ink); }

.player { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 18px; background: var(--player); color: var(--player-ink); overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .6rem; }
.player .ar, .player .play { position: relative; }
.player .ar { font-family: var(--f-ar); font-size: 1.9rem; direction: rtl; }
.player .play { width: 4rem; height: 4rem; border-radius: 50%; border: 0; background: var(--player-ink); color: var(--player); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.player .play svg { width: 1.8rem; height: 1.8rem; }
.player .wm { position: absolute; top: .6rem; right: .8rem; font-size: .7rem; opacity: .55; letter-spacing: .04em; }
.player .pfoot { position: absolute; left: .8rem; right: .8rem; bottom: .6rem; display: flex; flex-direction: column; gap: .3rem; }
.player .pfoot .bar { background: rgba(255,255,255,.2); }
.player .pfoot .bar i { background: var(--player-ink); }
.player .pfoot small { font-size: .75rem; opacity: .8; font-variant-numeric: tabular-nums; }

.qa { display: flex; flex-direction: column; gap: .7rem; }
.q { border: 1px solid var(--line); border-radius: 16px; padding: .9rem; display: flex; flex-direction: column; gap: .45rem; background: var(--bg); }
.q .who { display: flex; justify-content: space-between; gap: .5rem; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.q .who b { color: var(--ink); }
.ans { background: var(--green-soft); border-radius: 12px; padding: .7rem .8rem; display: flex; flex-direction: column; gap: .2rem; }
.ans b { color: var(--green); font-size: .85rem; }

label.f { display: flex; flex-direction: column; gap: .35rem; font-weight: 700; }
.input, textarea.input, select.input { width: 100%; min-height: 3.25rem; border: 2px solid var(--line); border-radius: 14px; padding: .7rem .9rem; background: var(--bg); color: var(--ink); }
textarea.input { min-height: 6rem; resize: vertical; line-height: 1.45; }
.input:focus { border-color: var(--green); outline: none; }

.nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding-top: .4rem; padding-bottom: calc(.5rem + env(safe-area-inset-bottom, 0px)); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); z-index: 5; }
.nav-in { max-width: 460px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: .25rem; }
.nav button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: .15rem; padding: .45rem 0; border-radius: 12px; cursor: pointer; color: var(--muted); font-weight: 700; font-size: .8rem; }
.nav button svg { width: 1.6rem; height: 1.6rem; }
.nav button.on { color: var(--green); background: var(--green-soft); }

.lock { text-align: center; align-items: center; }
.lock svg { width: 3rem; height: 3rem; color: var(--danger); }

.login { display: flex; flex-direction: column; gap: 1.2rem; padding-top: 1.5rem; }
.brand { display: flex; flex-direction: column; align-items: center; gap: .7rem; text-align: center; }
.mark { position: relative; overflow: hidden; width: 6rem; height: 7.2rem; border-radius: 50% 50% 18px 18px / 40% 40% 18px 18px; background: var(--green); color: var(--green-ink); display: flex; align-items: center; justify-content: center; padding-top: 1rem; font-family: var(--f-ar); font-size: 2.2rem; font-weight: 700; direction: rtl; box-shadow: inset 0 0 0 3px var(--gold); }
.mark span { position: relative; }
.brand h1 { font-size: 2rem; }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: .9rem; display: flex; flex-direction: column; gap: .15rem; }
.stat b { font-size: 1.6rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat span { font-size: .85rem; color: var(--muted); }
.tabs { display: flex; gap: .4rem; overflow-x: auto; padding-bottom: 2px; }
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: .75rem 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row > div { min-width: 0; }
.confirm { border: 2px solid var(--green); background: var(--green-soft); border-radius: 16px; padding: 1rem; display: flex; flex-direction: column; gap: .75rem; }
.note { font-size: .8rem; color: var(--muted); text-align: center; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(6.5rem + env(safe-area-inset-bottom, 0px)); max-width: min(420px, calc(100% - 32px)); background: var(--ink); color: var(--bg); padding: .8rem 1.1rem; border-radius: 14px; font-weight: 700; z-index: 20; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
</style>

</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script>
const I = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z" fill="currentColor"/></svg>',
  users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.2.6 3.5 2.6 3.5 6"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  cam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2.5" y="6" width="13" height="12" rx="2"/><path d="m15.5 10 6-3v10l-6-3z"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 4.1L20 7l-.9 5 .9 5-5.1.9L12 22l-2.9-4.1L4 17l.9-5L4 7l5.1-.9z"/></svg>',
  shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/></svg>'
};
const pattern = id => `<svg class="pat" aria-hidden="true"><defs><pattern id="${id}" width="44" height="44" patternUnits="userSpaceOnUse"><g fill="none" stroke-width="1.1"><rect x="12" y="12" width="20" height="20"/><rect x="12" y="12" width="20" height="20" transform="rotate(45 22 22)"/><circle cx="22" cy="22" r="3.5"/><path d="M0 0l7.5 7.5M44 0l-7.5 7.5M0 44l7.5-7.5M44 44l-7.5-7.5"/></g></pattern></defs><rect width="100%" height="100%" fill="url(#${id})"/></svg>`;

/* ---------- ACTIONS ---------- */
function act(a, v) {
  const top = () => window.scrollTo(0, 0);
  switch (a) {
    case 'role': S.role = v; S.playing = false; top(); break;
    case 'tab': S.tab = v; S.videoId = null; S.playing = false; top(); break;
    case 'open': S.videoId = +v; S.playing = false; top(); break;
    case 'back': S.videoId = null; S.playing = false; top(); break;
    case 'filter': S.filter = v; break;
    case 'play': S.playing = !S.playing; if ((S.progress[S.videoId] || 0) >= vById(S.videoId).min) S.progress[S.videoId] = 0; break;
    case 'speed': S.speed = +v; break;
    case 'big': S.big = !S.big; break;
    case 'install': if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); } return;
    case 'theme': S.theme = S.theme === 'dark' ? 'light' : 'dark'; saveTheme(); break;
    case 'themeSet': S.theme = v; saveTheme(); break;
    case 'adminOut': S.adminIn = false; S.adminTab = 'ringkasan'; top(); break;
    case 'bigSet': S.big = v === '1'; break;
    case 'goPay': S.tab = 'akaun'; S.videoId = null; S.pay = 'm'; top(); break;
    case 'pay': S.pay = v; break;
    case 'payCancel': S.pay = null; break;
    case 'payGo': {
      const months = S.pay === 'y' ? 12 : 1;
      S.expiry = addMonths(S.active ? S.expiry : TODAY, months);
      S.active = true; S.pay = null;
      toast('Bayaran diterima. Langganan aktif hingga ' + fmt(S.expiry) + ' (demo)');
      break;
    }
    case 'expire': if (S.active) { S.active = false; S.expiry = new Date(2026, 9, 12); toast('Paparan langganan tamat. Cuba buka menu Video.'); } break;
    case 'logout': S.loggedIn = false; S.tab = 'utama'; S.videoId = null; top(); break;
    case 'toast': toast(v); return;
    case 'atab': S.adminTab = v; S.blastConfirm = false; top(); break;
    case 'remind':
      S.adminTab = 'hebahan'; S.blastTarget = 'tamat7'; S.blastConfirm = false;
      S.drafts.blastText = 'Assalamualaikum. Langganan Madrasah Online anda akan tamat dalam 7 hari. Sambung RM10 dalam app supaya video kelas tak terkunci.';
      top(); break;
    case 'bt': S.blastTarget = v; S.blastConfirm = false; break;
    case 'bc': S[v] = !S[v]; S.blastConfirm = false; break;
    case 'blastCancel': S.blastConfirm = false; break;
    case 'blastGo': {
      const [lbl, n] = blastTargets[S.blastTarget];
      blastHistory.unshift({ teks: S.drafts.blastText, kepada: lbl + ' · ' + n, masa: fmt(TODAY) });
      S.blastConfirm = false;
      toast('Hebahan dihantar kepada ' + n + ' pelajar (demo)');
      break;
    }
    case 'answer': {
      const id = +v, txt = (S.drafts['ans-' + id] || '').trim();
      if (!txt) { toast('Tulis jawapan dulu sebelum hantar.'); return; }
      questions.find(q => q.id === id).jawapan = txt; delete S.drafts['ans-' + id];
      toast('Jawapan dihantar. Pelajar akan nampak dalam app.');
      break;
    }
  }
  render();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  e.preventDefault();
  act(el.dataset.a, el.dataset.v);
});
document.addEventListener('input', e => {

document.addEventListener('submit', e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === 'loginForm') { S.loggedIn = true; S.tab = 'utama'; toast('Assalamualaikum, Puan Rohana'); }
  if (id === 'adminLogin') { S.adminIn = true; S.adminTab = 'ringkasan'; window.scrollTo(0, 0); }
  if (id === 'askVideo' || id === 'askGeneral') {
    const key = id + 'Text', txt = (S.drafts[key] || '').trim();
    if (!txt) { toast('Tulis soalan dulu sebelum hantar.'); return; }
    questions.push({ id: nextQ++, vid: id === 'askVideo' ? S.videoId : null, nama: 'Puan Rohana', masa: 'Baru tadi', teks: txt, jawapan: null });
    delete S.drafts[key];
    toast('Soalan dihantar. Ustaz akan jawab di sini.');
  }
  if (id === 'blastForm') {
    if (!(S.drafts.blastText || '').trim()) { toast('Tulis mesej hebahan dulu.'); return; }
    if (!S.wa && !S.app) { toast('Pilih sekurang-kurangnya satu saluran.'); return; }
    S.blastConfirm = true;
  }
  if (id === 'uploadForm') {
    const t = (S.drafts.upTitle || '').trim();
    if (!t) { toast('Isi tajuk video dulu.'); return; }
    const topik = document.getElementById('upTopik').value;
    videos.unshift({ id: nextV++, topik, tajuk: t, ar: 'درس جديد', tarikh: 'Okt 2026', min: 60, baru: true });
    delete S.drafts.upTitle;
    toast('Video ditambah. Pelajar boleh tonton selepas siap diproses.');
  }
  render();
});

setInterval(() => {
  if (S.role !== 'pelajar' || !S.playing || !S.videoId) return;
  const v = vById(S.videoId);
  S.progress[v.id] = Math.min(v.min, (S.progress[v.id] || 0) + 0.5 * S.speed);
  const bar = document.getElementById('pbar'), t = document.getElementById('ptime');
  if (bar) bar.style.width = pct(v.id) + '%';
  if (t) t.textContent = Math.round(S.progress[v.id]) + ' / ' + v.min + ' minit';
  if (S.progress[v.id] >= v.min) { S.playing = false; render(); }
}, 1000);

render();
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {})); }
</script>
</body>
